name: Threads Content Review (Publishing Paused)

on:
  workflow_dispatch:

concurrency:
  group: threads-daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate new pilot expression selection
        run: python scripts/validate_expression_selection.py

      - name: Confirm publishing is paused
        run: |
          echo "## 자동 게시 중지 상태" >> "$GITHUB_STEP_SUMMARY"
          echo "콘텐츠 전면 재검토가 끝날 때까지 예약·수동 게시 단계가 비활성화되어 있습니다." >> "$GITHUB_STEP_SUMMARY"

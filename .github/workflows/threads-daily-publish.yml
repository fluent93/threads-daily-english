name: Daily Threads Expression Auto-Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 실행 모드
        required: true
        default: validate
        type: choice
        options:
          - validate
          - dry-run
          - publish
          - answer

concurrency:
  group: threads-daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # workflow_dispatch 이벤트는 요청을 받은 시점의 commit SHA를 체크아웃한다.
      # Scheduler 재시도나 수동 실행이 대기열에 겹쳐도, 게시 직전에는 최신 상태를
      # 다시 읽어 이미 발행된 Day를 중복으로 올리지 않도록 한다.
      - name: Refresh posting state from master
        run: |
          git fetch origin master --depth=1
          git checkout origin/master -- data/threads_post_state.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate approved expression selection
        run: python scripts/validate_expression_selection.py

      - name: Validate approved card copy
        run: python scripts/validate_pilot_copy.py

      - name: Validate next monthly review batch
        run: |
          python scripts/validate_expression_selection.py data/batch_015_030_selection.json
          python scripts/validate_pilot_copy.py \
            --selection data/batch_015_030_selection.json \
            --copy data/batch_015_030_card_copy.json
          python scripts/validate_content.py \
            --review \
            --queue data/batch_015_030_review_queue.json \
            --images review_images/batch_015_030

      - name: Validate production queue and cards
        run: python scripts/validate_content.py

      - name: Report content quality metrics
        run: python scripts/report_content_quality.py

      - name: Preview next post
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: python scripts/publish_daily_expression.py --dry-run

      - name: Check Threads account, permissions, and token expiry
        if: github.event_name == 'schedule' || inputs.mode == 'publish' || inputs.mode == 'answer'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/check_threads_access.py

      - name: Publish daily question to Threads
        if: (github.event_name == 'schedule' && (github.event.schedule == '35 22 * * *' || github.event.schedule == '50 22 * * *' || github.event.schedule == '7 23 * * *')) || inputs.mode == 'publish'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOPIC_TAG: ${{ vars.THREADS_TOPIC_TAG }}
        run: python scripts/publish_daily_expression.py --publish --not-before 08:07

      - name: Reveal due recommendations in their original threads
        if: (github.event_name == 'schedule' && (github.event.schedule == '35 4 * * *' || github.event.schedule == '50 4 * * *' || github.event.schedule == '7 5 * * *')) || inputs.mode == 'answer'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/publish_delayed_answer.py --wait-until-due

      - name: Commit and push state changes
        if: always()
        run: |
          if [[ ! -f data/threads_post_state.json ]]; then
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/threads_post_state.json
          git diff --staged --quiet || (git commit -m "chore: update threads post state [skip ci]" && git push)

      - name: Write failure summary
        if: failure()
        run: |
          echo "## Threads 자동 게시 실패" >> "$GITHUB_STEP_SUMMARY"
          echo "부분 게시 상태가 있으면 다음 실행에서 이어서 복구합니다." >> "$GITHUB_STEP_SUMMARY"

name: Daily Threads Expression Auto-Publisher

on:
  schedule:
    # 매일 한국 시간(KST) 오전 08:00 (UTC 23:00)에 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 가능

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Publish Daily Expression to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python scripts/publish_daily_expression.py --publish

      - name: Commit and push state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/threads_post_state.json
          git diff --staged --quiet || (git commit -m "chore: update threads post state [skip ci]" && git push)

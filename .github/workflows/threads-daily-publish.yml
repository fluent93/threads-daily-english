name: Threads Content Review (Publishing Paused)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 실행 모드
        required: true
        default: validate
        type: choice
        options:
          - validate
          - dry-run

concurrency:
  group: threads-daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate all content and cards
        run: python scripts/validate_content.py

      - name: Report content quality metrics
        run: python scripts/report_content_quality.py

      - name: Preview next post
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: python scripts/publish_daily_expression.py --dry-run

      - name: Confirm publishing is paused
        run: |
          echo "## 자동 게시 중지 상태" >> "$GITHUB_STEP_SUMMARY"
          echo "콘텐츠 전면 재검토가 끝날 때까지 예약·수동 게시 단계가 비활성화되어 있습니다." >> "$GITHUB_STEP_SUMMARY"
